name: Supabase Keep-Alive

on:
  schedule:
    # Cada 5 días a las 12:00 UTC
    - cron: '0 12 */5 * *'
  workflow_dispatch: # Botón manual para probar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to prevent sleep
        run: |
          echo "🏓 Pinging Supabase to keep database awake..."
          # Query ligera que toca la DB sin importar datos
          curl -s "${{ secrets.SUPABASE_URL }}/rest/v1/cotizaciones?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -o /dev/null -w "HTTP Status: %{http_code}\n"
          echo "✅ Ping completado - DB activa"
